kind = "web"
previewPath = "/"
title = "Psicóloga Camila Mazur"
version = "1.0.0"
id = "artifacts/site-camila-mazur"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22258

[services.development]
run = "pnpm --filter @workspace/site-camila-mazur run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/site-camila-mazur", "run", "build" ]
publicDir = "artifacts/site-camila-mazur/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22258"
BASE_PATH = "/"
